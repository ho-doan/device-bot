name: Release MCP server

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --manifest-path server/Cargo.toml --release --locked -p device-bot --target ${{ matrix.target }}
      - name: Package macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="device-bot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "server/target/${{ matrix.target }}/release/device-bot" "$staging/device-bot"
          tar -czf "${staging}.tar.gz" -C "$staging" device-bot
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "device-bot-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "server\target\${{ matrix.target }}\release\device-bot.exe" "$staging\device-bot.exe"
          Compress-Archive -Path "$staging\device-bot.exe" -DestinationPath "$staging.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: device-bot-${{ matrix.target }}
          path: |
            device-bot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            device-bot-${{ github.ref_name }}-${{ matrix.target }}.zip

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd dist
          sha256sum device-bot-*.tar.gz device-bot-*.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/device-bot-*.tar.gz
            dist/device-bot-*.zip
            dist/checksums.txt
