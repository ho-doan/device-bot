name: Release native tools

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing Cargo version to benchmark (for example v0.1.18); does not publish a release'
        required: true
        type: string

env:
  ARCHIVE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  qc-web:
    name: Build shared QC web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up release Flutter
        uses: ./.github/actions/setup-release-flutter
        with:
          platform: web
      - name: Build QC web app once for every release archive
        working-directory: server/flutter_app
        run: flutter build web --release --base-href /qc/
      - uses: actions/upload-artifact@v4
        with:
          name: qc-web
          path: server/flutter_app/build/web
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: qc-web
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            flutter-platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            flutter-platform: macos
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            flutter-platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: release-${{ matrix.target }}
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
      - name: Validate release manifest versions
        run: python -c "import os; from scripts.package_release import validate_release_versions; validate_release_versions(os.environ['ARCHIVE_VERSION'].removeprefix('v'))"
      - run: python scripts/test_package_release.py
      - name: Build Rust release tools
        run: cargo build --manifest-path server/Cargo.toml --release --locked -p device-bot -p robot-flow -p robot-report --target ${{ matrix.target }}
      - name: Validate built CLI versions before building QC
        run: python -c "import os; from scripts.package_release import validate_release_versions; validate_release_versions(os.environ['ARCHIVE_VERSION'].removeprefix('v'), 'server/target/${{ matrix.target }}/release')"
      - name: Set up release Flutter
        uses: ./.github/actions/setup-release-flutter
        with:
          platform: ${{ matrix.flutter-platform }}
      - name: Build QC macOS app
        if: runner.os == 'macOS'
        working-directory: server/flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
      - name: Build QC Windows app
        if: runner.os == 'Windows'
        working-directory: server/flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
      - name: Reuse shared QC web build
        uses: actions/download-artifact@v4
        with:
          name: qc-web
          path: server/flutter_app/build/web
      - name: Package macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot" --target '${{ matrix.target }}' --version "$ARCHIVE_VERSION" --output dist --qc server/flutter_app/build/macos/Build/Products/Release/mobile_mcp_companion.app --qc-web server/flutter_app/build/web
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot.exe" --target '${{ matrix.target }}' --version $env:ARCHIVE_VERSION --output dist --qc server/flutter_app/build/windows/x64/runner/Release --qc-web server/flutter_app/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: device-bot-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/device-bot-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.tar.gz
            dist/device-bot-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.zip

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: device-bot-*
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          files=(
            "device-bot-v${version}-aarch64-apple-darwin.tar.gz"
            "device-bot-v${version}-x86_64-apple-darwin.tar.gz"
            "device-bot-v${version}-x86_64-pc-windows-msvc.zip"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release archive: $file" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum "${files[@]}" > ../checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/device-bot-*.tar.gz
            dist/device-bot-*.zip
      - name: Publish checksums as text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | select(.name=="checksums.txt") | .id')"
          if [ -n "$asset_id" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          fi
          upload_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.upload_url' | sed 's/{?name,label}//')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @checksums.txt \
            "${upload_url}?name=checksums.txt"
