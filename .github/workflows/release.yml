name: Release native tools

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
      - run: python scripts/test_package_release.py
      - run: cargo build --manifest-path server/Cargo.toml --release --locked -p device-bot -p robot-flow -p robot-report --target ${{ matrix.target }}
      - name: Package macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot" --target '${{ matrix.target }}' --version "$GITHUB_REF_NAME" --output dist
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot.exe" --target '${{ matrix.target }}' --version $env:GITHUB_REF_NAME --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: device-bot-${{ matrix.target }}
          path: |
            dist/device-bot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/device-bot-${{ github.ref_name }}-${{ matrix.target }}.zip

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd dist
          sha256sum device-bot-*.tar.gz device-bot-*.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/device-bot-*.tar.gz
            dist/device-bot-*.zip
            dist/checksums.txt
