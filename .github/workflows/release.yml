name: Release native tools

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
      - run: python scripts/test_package_release.py
      - run: cargo build --manifest-path server/Cargo.toml --release --locked -p device-bot -p robot-flow -p robot-report --target ${{ matrix.target }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Build QC macOS app
        if: runner.os == 'macOS'
        working-directory: server/flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
      - name: Build QC Windows app
        if: runner.os == 'Windows'
        working-directory: server/flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
      - name: Build QC web app
        working-directory: server/flutter_app
        run: flutter build web --release --base-href /qc/
      - name: Package macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot" --target '${{ matrix.target }}' --version "$GITHUB_REF_NAME" --output dist --qc server/flutter_app/build/macos/Build/Products/Release/mobile_mcp_companion.app --qc-web server/flutter_app/build/web
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package_release.py --binary "server/target/${{ matrix.target }}/release/device-bot.exe" --target '${{ matrix.target }}' --version $env:GITHUB_REF_NAME --output dist --qc server/flutter_app/build/windows/x64/runner/Release --qc-web server/flutter_app/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: device-bot-${{ matrix.target }}
          path: |
            dist/device-bot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/device-bot-${{ github.ref_name }}-${{ matrix.target }}.zip

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          files=(
            "device-bot-v${version}-aarch64-apple-darwin.tar.gz"
            "device-bot-v${version}-x86_64-apple-darwin.tar.gz"
            "device-bot-v${version}-x86_64-pc-windows-msvc.zip"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release archive: $file" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum "${files[@]}" > ../checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/device-bot-*.tar.gz
            dist/device-bot-*.zip
      - name: Publish checksums as text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | select(.name=="checksums.txt") | .id')"
          if [ -n "$asset_id" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          fi
          upload_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.upload_url' | sed 's/{?name,label}//')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @checksums.txt \
            "${upload_url}?name=checksums.txt"
