name: Warm release Rust cache

# GitHub isolates tag caches: a new release can restore caches from master,
# but cannot restore a previous tag's cache. Refresh dependencies here so
# subsequent tags reuse the same target/toolchain-specific release artifacts.
on:
  push:
    branches: [master]
    paths:
      - 'server/**/Cargo.toml'
      - 'server/Cargo.lock'
      - '**/.cargo/config.toml'
      - '**/rust-toolchain*'
      - '.github/workflows/rust-cache.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Cache ${{ matrix.target }}
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Restore Rust release dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Report Rust dependency cache status
        shell: bash
        env:
          EXACT_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          echo "Exact Rust dependency cache hit: ${EXACT_CACHE_HIT:-false}"
          echo "A non-exact hit can still restore compatible dependencies from a fallback key."
          echo "Exact hits skip only this warmer build; release jobs still compile workspace code."
      - name: Warm Rust release dependencies
        id: warm-build
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --manifest-path server/Cargo.toml --release --locked --timings -p device-bot -p robot-flow -p robot-report --target ${{ matrix.target }}
      - name: Upload Rust warm-build timings
        if: always() && steps.warm-build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: rust-warm-timings-${{ matrix.target }}
          path: server/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
