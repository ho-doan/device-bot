name: Verify Windows Live candidate

on:
  workflow_dispatch:
    inputs:
      qc-only:
        description: Rebuild only QC after the Rust candidate has already passed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.qc-only }}
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.qc-only }}
        with:
          workspaces: server -> target
          shared-key: release-x86_64-pc-windows-msvc
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify capture and console regressions on Windows
        if: ${{ !inputs.qc-only }}
        run: cargo test --manifest-path server/Cargo.toml --release --locked --target x86_64-pc-windows-msvc -p robot-chrome -p robot-windows -p robot-android
      - name: Build candidate CLI tools
        if: ${{ !inputs.qc-only }}
        run: cargo build --manifest-path server/Cargo.toml --release --locked --target x86_64-pc-windows-msvc -p device-bot -p robot-flow -p robot-report
      - uses: ./.github/actions/setup-release-flutter
        with:
          platform: windows
      - name: Analyze Live viewer changes
        working-directory: server/flutter_app
        run: flutter analyze lib/android_video.dart lib/android_live.dart test/android_video_test.dart test/android_live_test.dart test/windows_live_test.dart
      - name: Verify Live viewer regressions
        working-directory: server/flutter_app
        run: flutter test test/android_video_test.dart test/android_live_test.dart test/windows_live_test.dart
      - name: Build candidate QC apps
        working-directory: server/flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          flutter build web --release --base-href /qc/
      - name: Package candidate without publishing
        if: ${{ !inputs.qc-only }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          version = tomllib.loads(Path('server/Cargo.toml').read_text())['workspace']['package']['version']
          subprocess.run([
              sys.executable, 'scripts/package_release.py',
              '--binary', 'server/target/x86_64-pc-windows-msvc/release/device-bot.exe',
              '--target', 'x86_64-pc-windows-msvc', '--version', version,
              '--output', 'dist', '--qc', 'server/flutter_app/build/windows/x64/runner/Release',
              '--qc-web', 'server/flutter_app/build/web',
          ], check=True)
          PY
      - name: Package QC overlay for the verified Rust candidate
        if: inputs.qc-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tempfile
          Path('dist').mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory() as directory:
              stage = Path(directory)
              shutil.copytree('server/flutter_app/build/windows/x64/runner/Release', stage / 'qc')
              shutil.copytree('server/flutter_app/build/web', stage / 'qc-web')
              shutil.make_archive('dist/windows-qc-candidate', 'zip', stage)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.qc-only && 'qc' || 'live' }}-candidate-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
