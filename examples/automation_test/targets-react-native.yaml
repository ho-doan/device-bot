version: 1
# React Native testID is the automation resource ID; nativeID serves a different
# purpose and can differ (for example submit-button vs sign-in-button).
selectors:
  # Samsung's email suggestions become the active accessibility window after
  # focus. Type immediately to dismiss them instead of querying focus there.
  email: {resource_id: email-field, element_type: textField}
  password: {resource_id: password-field, element_type: textField, require_focus: true}
  show_password: {resource_id: password-visibility-control, label: Show password}
  hide_password: {resource_id: password-visibility-control, label: Hide password}
  sign_in: {resource_id: submit-button}
  viewport: {class_contains: android.widget.ScrollView, largest: true}
targets:
  rn-android:
    device: {platform: android, state: available}
    app_id: com.rnapp
    preconditions: [fixture_ready]
    recipes:
      open_fixture:
        - launch_app: {app_id: '${app_id}'}
        - wait: {ms: 1500}
