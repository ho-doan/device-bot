version: 1
selectors:
  email: {resource_id: email-field}
  password: {resource_id: password-field}
  show_password: {label: Show password}
  hide_password: {label: Hide password}
  sign_in: {label: Sign in, element_type: button}
recipes:
  open_fixture:
    - launch_app: {app_id: '${app_id}'}
    - wait: {ms: 1500}
targets:
  rn-ios:
    device: {platform: ios, state: available}
    app_id: org.reactjs.native.example.rnApp
    preconditions: [fixture_ready]
  vite:
    device: {platform: chrome, state: available}
    app_id: http://127.0.0.1:5173/login
    preconditions: [fixture_ready]
  electron:
    device: {platform: chrome, state: available}
    app_id: http://localhost:5173/login
    preconditions: [fixture_ready]
