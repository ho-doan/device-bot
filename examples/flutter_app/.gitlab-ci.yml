# Adapted from ho.doan/automation-test-mobile (951e397).
stages:
  - validate
  - automation

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  PLATFORM: "ios-sim"
  MOBILE_RUNNER_TAG: "mobile-ios-sim"
  MOBILE_TESTS_ENABLED: "true"
  WINDOWS_TESTS_ENABLED: "false"
  SCENARIO_TIMEOUT: "600"
  RPC_TIMEOUT: "180"
  MCP_TIMEOUT: "180"
  PYTHONUNBUFFERED: "1"
  DEVICE_BOT_FLUTTER_AUTOSTART: "0"
  DEVICE_BOT_VERSION: "0.1.3"
  DEVICE_BOT_IOS_AGENT_BIND: "127.0.0.1:19787"
  DEVICE_BOT_IOS_SIM_AGENT_BIND: "127.0.0.1:19788"
  SCENARIO_RECORDS_VIDEO: "true"

flutter:validate:
  stage: validate
  tags:
    - mobile-macos
  script:
    - python3 ci/validate.py
    - python3 -m unittest discover -s ci/tests -v
    - flutter pub get
    - flutter analyze
    - flutter test

mobile:automation:
  stage: automation
  tags:
    - $MOBILE_RUNNER_TAG
  resource_group: $MOBILE_RUNNER_TAG
  timeout: 1h
  interruptible: false
  rules:
    - if: '$MOBILE_TESTS_ENABLED == "true"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true
  script:
    - mkdir -p artifacts
    - set -o pipefail
    - source ci/ensure_device_bot.sh > artifacts/device-bot-install.log 2>&1
    - cat artifacts/device-bot-install.log
    - bash ci/prepare_app.sh 2>&1 | tee artifacts/build.log
    - python3 ci/run_suite.py
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit.xml

windows:automation:
  stage: automation
  tags:
    - mobile-windows
  resource_group: windows-desktop
  timeout: 1h
  interruptible: false
  variables:
    PLATFORM: "windows"
    DEVICE_ID: "windows-host"
    DEVICE_BOT_BIN: "$WINDOWS_DEVICE_BOT_BIN"
  rules:
    - if: '$WINDOWS_TESTS_ENABLED == "true"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true
  script:
    - bash ci/run_windows.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit.xml
