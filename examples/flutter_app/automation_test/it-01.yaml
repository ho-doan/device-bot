---
version: 2
name: orbit_it_01
description: Native UI assertions ported from it-01.sh; fixture setup is external.
steps:
- id: it-01-01
  select_device: "${device}"
- id: it-01-02
  start_screen_recording: {}
- id: it-01-03
  launch_app:
    app_id: "${app_id}"
- id: it-01-04
  assert_element:
    label: Welcome back.
    timeout_ms: 120000
- id: it-01-05
  screenshot:
    path: login.png
- id: it-01-06
  tap_element:
    target: demo
- id: it-01-07
  assert_element:
    label: A fresh start, Alex.
- id: it-01-08
  assert_element:
    label: 1/3
- id: it-01-09
  screenshot:
    path: result.png
- id: it-01-10
  stop_screen_recording: {}
