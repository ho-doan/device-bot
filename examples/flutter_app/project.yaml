version: 1
kind: project
name: orbit
# Build/install/cold-stop is still external setup for these existing flows.
before_each_flow: automation_test/support/warmup.yaml
platforms:
  android:
    profiles: automation_test/targets-semantics.yaml
    prepare: {kind: artifact_file, path_env: ORBIT_APK, file_name: app.apk}
    before_all_flow: automation_test/support/install-android.yaml
    before_each_flow: automation_test/support/reset-mobile.yaml
  ios-sim:
    profiles: automation_test/targets-semantics.yaml
    before_each_flow: automation_test/support/reset-mobile.yaml
  windows:
    profiles: automation_test/targets-semantics.yaml
flows:
  - automation_test/it-01.yaml
  - automation_test/it-02.yaml
  - automation_test/it-03.yaml
  - automation_test/it-04.yaml
  - automation_test/it-05.yaml
  - automation_test/it-06.yaml
  - automation_test/it-07.yaml
  - automation_test/it-08.yaml
  - automation_test/it-09.yaml
windows_fixture: '${env:APP_ID}'
