<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Chat</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><h1>Project Chat</h1><p>Two-account messaging demo</p></header><p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>Sign in</h2><form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section>
<section id="chat" hidden><div class="toolbar"><h2 id="identity"></h2><button id="logout">Sign out</button></div><button id="notifications">Enable notifications</button><p id="permission-status">Notification permission not requested</p><div class="columns"><section><h3>Find a contact</h3><form id="search-form"><label for="search">Contact name</label><input id="search" required><button>Search contacts</button></form><div id="contacts"></div></section><section><h3 id="conversation-title">No conversation selected</h3><ol id="messages" aria-live="polite"></ol><form id="message-form" hidden><label for="message">Message</label><input id="message" required maxlength="2000"><button>Send message</button></form></section></div></section></main><script src="/app.js"></script></body></html>
