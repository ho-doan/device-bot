version: 1
kind: project
name: project-chat
env_file: .env
hosts:
  - name: local
    platform: macos
    binding: {kind: local}
resources:
  - name: chrome-alice
    kind: chrome
    host: local
    display: {host: local}
    prepare: {kind: launch, url: '${env:CHAT_URL}'}
    timeout_ms: 30000
    requires: [input, elements]
  - name: chrome-bob
    kind: chrome
    host: local
    display: {host: local}
    prepare: {kind: launch, url: '${env:CHAT_URL}'}
    timeout_ms: 30000
    requires: [input, elements]
  - name: desktop
    kind: macos
    host: local
    display: {host: local}
    prepare: {kind: attach}
    timeout_ms: 30000
    requires: [input, elements]
actors:
  - {name: alice, resource: chrome-alice}
  - {name: bob, resource: chrome-bob}
flows:
  - path: account1.yaml
    profiles: profiles.yaml
    bindings:
      - {actor: alice, profile: chat}
