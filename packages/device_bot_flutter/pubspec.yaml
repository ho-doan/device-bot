name: device_bot_flutter
description: Flutter widget-tree discovery fallback for Device Bot on native and web platforms.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.15.1
  json_serializable: ^6.15.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DeviceBotFlutterPlugin
