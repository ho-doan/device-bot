[workspace]
members = [
    "crates/mcp-protocol",
    "crates/mcp-server",
    "crates/admin-api",
    "crates/robot-core",
    "crates/robot-flutter-bridge",
    "crates/robot-android",
    "crates/robot-chrome",
    "crates/robot-ios-real",
    "crates/robot-ios-sim",
    "crates/robot-macos",
    "crates/robot-windows",
    "crates/robot-flow",
    "crates/robot-report",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ho-doan/device-bot"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
libc = "0.2.180"
tokio = { version = "1.50.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower = "0.5.2"
tokio-stream = { version = "0.1.18", features = ["sync"] }
uuid = { version = "1.21.0", features = ["v4"] }
