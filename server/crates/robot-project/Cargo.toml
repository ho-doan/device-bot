[package]
name = "robot-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
robot-flow = { path = "../robot-flow" }
robot-report = { path = "../robot-report" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
dotenvy = "0.15.7"
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
uuid.workspace = true
