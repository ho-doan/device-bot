[package]
name = "robot-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
robot-flow = { path = "../robot-flow" }
robot-report = { path = "../robot-report" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["signal"] }
url = "2.5.8"
# Select the Rust decoder without the optional Zopfli encoder (Rust 1.88+).
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
uuid.workspace = true
